aid: 5b4844
name: 5B Australia
description: '5B is an Australian cleantech manufacturer that builds prefabricated, pre-wired ground-mount
  solar technology for utility-scale, mining, industrial and remote-community power projects. Founded
  in Sydney in 2013 by solar engineers Chris McGrath and Eden Tehan, the company designs and manufactures
  the 5B Maverick, an accordion-folded east-west solar array that is assembled in a factory and unfolded
  on site in under an hour rather than built panel by panel, cutting on-site labour by roughly 80% and
  roughly doubling energy yield per hectare compared with single-axis trackers. 5B manufactures in Adelaide,
  South Australia, with a global assembly model, and has deployed projects across Australia, the United
  States, Panama, Puerto Rico, El Salvador and Chile. 5B is a hardware and deployment-services company:
  as of this profile it publishes no developer portal, no public API, and no machine-readable API contract
  on any host it controls.'
